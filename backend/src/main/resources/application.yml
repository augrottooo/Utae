server:
  address: ${UTAE_BIND_ADDRESS:127.0.0.1}
  port: ${UTAE_API_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: UTAESESSION
        http-only: true
        secure: true
        same-site: lax
spring:
  datasource:
    url: ${UTAE_DB_URL}
    username: ${UTAE_DB_USER}
    password: ${UTAE_DB_PASSWORD}
  flyway:
    enabled: ${UTAE_MIGRATE:false}
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
utae:
  bootstrap:
    username: ${UTAE_BOOTSTRAP_USERNAME:}
    password: ${UTAE_BOOTSTRAP_PASSWORD:}
  storage:
    mode: minio
    endpoint: ${UTAE_MINIO_ENDPOINT:}
    access-key: ${UTAE_MINIO_ACCESS_KEY:}
    secret-key: ${UTAE_MINIO_SECRET_KEY:}
    bucket: ${UTAE_MINIO_BUCKET:utae}
